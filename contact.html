<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Jake Riddell</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Minimal CSS - 20 lines total */
        body { 
            margin: 0; padding: 120px 2rem 4rem; 
            background: #000; color: #fff; 
            font-family: -apple-system, sans-serif; 
            text-align: left; 
        }
        h1 { font-size: clamp(4rem, 12vw, 10rem); font-weight: 700; margin: 0 0 3rem 0; }
        .contacts { margin: 0 auto; display: flex; flex-direction: column; gap: 2rem; text-align: left;}
        .contact { font-size: clamp(2rem, 6vw, 4rem); font-weight: 600; }
        .contact a { color: #fff; text-decoration: none; }
        .contact a:hover { opacity: 0.8; }
        @media (max-width: 768px) { body { padding: 100px 1.5rem 2rem; } }

        .resume-viewer {
         width: 100%; 
         max-width: 800px; 
         margin-top: 2rem;
         border-radius: 8px;
         overflow: hidden;
        }
        .resume-toggle {
         cursor: pointer;
         position: relative;
        }
        .resume-toggle:hover {
        opacity: 0.8;
        }

    </style>
</head>
<script>
function toggleResume() {
    const viewer = document.getElementById('resume-viewer');
    if (viewer.style.display === 'none') {
        viewer.style.display = 'block';
    } else {
        viewer.style.display = 'none';
    }
}
</script>
<body>
    <nav>
        <div class="nav-container">
            <a href="/" class="nav-brand">Jake Riddell</a>
            <div class="nav-links">
                <a href="/#work" class="nav-link">Work</a>
                <a href="profile" class="nav-link">Profile</a>
                <a href="mailto:j6riddel@uwaterloo.ca" class="nav-link">Contact</a>
            </div>
        </div>
  </nav>

    <h1>Contact</h1>
    
    <div class="contacts">
        <div class="contact"><a href="mailto:j6riddel@uwaterloo.ca">j6riddel@uwaterloo.ca</a></div>
        <div class="contact"><a href="https://www.linkedin.com/in/jakeridd/">LinkedIn</a></div>
        <div class="contact"><a href="https://jakeriddell.com">jakeriddell.com</a></div>
        <div class="contact resume-toggle" onclick="toggleResume()">Resume</div>
    
        <!-- Hidden PDF viewer -->
        <div id="resume-viewer" class="resume-viewer" style="display: none;">
        <iframe src="S26 Co-op Resume - Jake Riddell.pdf" width="100%" height="800" frameborder="0"></iframe>
    </div>
    </div>
</body>
</html>
