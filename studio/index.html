<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Unlisted page: keep it out of Google and out of any crawler's index.
       Deliberately NOT listed in robots.txt — a Disallow line would publish
       this path to anyone who opens /robots.txt. -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">

  <title>Riddell Social</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">

  <!-- Self-contained by design: no /styles.css, no nav, no analytics.
       This page should leave no trace on the rest of the site. -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #000000;
      color: #ffffff;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      /* The page is short by design — hold it in the middle of the viewport
         so the surrounding emptiness reads as deliberate, not unfinished. */
      min-height: 100vh;
      display: flex;
      align-items: center;
    }

    a { color: inherit; text-decoration: none; }

    .shell {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }

    .eyebrow {
      font-size: 0.875rem;
      letter-spacing: normal;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: clamp(2.5rem, 6vh, 3.5rem);
    }

    h1 {
      font-size: clamp(2.75rem, 7vw, 4.5rem);
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1.02;
      margin-bottom: 2rem;
    }

    .lede {
      font-size: 1.0625rem;
      color: rgba(255, 255, 255, 0.62);
      max-width: 52ch;
    }

    .rule {
      height: 1px;
      background: rgba(255, 255, 255, 0.14);
      margin: clamp(3rem, 7vh, 4rem) 0;
    }


    .note {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 0.5rem;
    }



    .meta {
      margin-top: 0;
      font-size: 0.875rem;
      letter-spacing: normal;
      color: rgba(255, 255, 255, 0.35);
    }

    @media (max-width: 600px) {
      body { align-items: flex-start; }
      .shell { padding: 4rem 1.25rem 3rem; }
    }
  </style>
</head>
<body>

  <main class="shell">

    <!-- EDIT ME: name + what you do -->
    <p class="eyebrow">Riddell Social</p>

    <h1>Social media management.</h1>

    <p class="lede">
      We run social channels for brands. Strategy, content, and the day-to-day
      posting and community work that keeps them going.
    </p>

    <div class="rule"></div>

    <section class="standing">
      <p class="note">Currently not accepting new clients.</p>
      <p class="meta">Toronto</p>
    </section>

  </main>

</body>
</html>
